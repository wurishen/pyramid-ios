# SwiftLint 配置 for Pyramid iOS
# Goal: 抓到真问题（未用 import / 重复 closure / 错误初始化），不刷风格分。
# Run in CI without --strict: warnings only, 不会因风格问题阻塞 PR。

included:
  - Pyramid
  - swift-tests

excluded:
  - Pyramid/Resources
  - Pyramid/Pods
  - swift-tests/.build
  - "**/*.xcodeproj/**"

# 关闭风格 / 噪音规则
disabled_rules:
  - todo
  - force_cast
  - identifier_name
  - line_length
  - file_length
  - function_body_length
  - type_body_length
  - cyclomatic_complexity
  - for_where
  - statement_position
  - vertical_parameter_alignment
  - implicit_optional_initialization
  - implicit_return
  - trailing_newline
  - comma
  - redundant_nil_coalescing
  - opening_brace
  - closure_end_indentation
  - closure_parameter_position
  - comma_inheritance
  - explicit_init
  - explicit_self
  - prefer_self_type_over_type_of_self
  - sorted_imports
  - non_optional_string_data_conversion
  - weak_delegate
  - fatal_error_message
  - multiple_closures_with_trailing_closure
  - first_where
  - override_in_extension
  - prefer_zero_over_explicit_init
  - large_tuple
  - prefer_key_path
  - no_fallthrough_only_switch
  - no_extension_access_modifier

# 主动启用：抓真 bug
opt_in_rules:
  - empty_count
  - unused_import
  - unused_declaration
  - unused_closure_parameter
  - redundant_discardable_let
  - redundant_type_annotation
  - private_outlet
  - private_action
  - unused_setter_value
  - empty_string
  - switch_case_on_newline
  - type_name
  - todo

# 风格阈值
line_length: 140
type_body_length:
  warning: 600
  error: 1200
file_length:
  warning: 800
  error: 1500
function_body_length:
  warning: 100
  error: 200
