name: Bootstrap iOS test target
on:
  workflow_dispatch:

# 在 macos-14 runner 上跑 scripts/add-pyramid-tests-target.rb（用 xcodeproj gem），
# 把 PyramidTests target 永久装进 Pyramid.xcodeproj，并把 project.pbxproj 的改动
# 自动 commit 回来。一次跑就够（脚本本身幂等），之后 CI 测试步骤会自动激活。
#
# 触发方式（两种都行）：
#   gh workflow run bootstrap-ios-tests.yml
#   GitHub UI → Actions → Bootstrap iOS test target → Run workflow

jobs:
  bootstrap:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Run Ruby bootstrap script
        run: ruby scripts/add-pyramid-tests-target.rb

      - name: Verify scheme wiring
        id: verify
        run: |
          echo "=== generated scheme Testables section ==="
          awk '/<Testables>/,/<\/Testables>/' Pyramid.xcodeproj/xcshareddata/xcschemes/Pyramid.xcscheme
          echo "=========================================="
          # 只 grep 验证，避开 xcodebuild -list 在 macOS-14+Xcode 16 上偶发的
          # `-[__NSArrayM setScheme:]: unrecognized selector` 内部崩溃。
          # 主 CI workflow 在 bootstrap 提交后会跑真正的 xcodebuild test。
          if grep -q 'PyramidTests' Pyramid.xcodeproj/xcshareddata/xcschemes/Pyramid.xcscheme; then
            echo "✓ PyramidTests is in Pyramid scheme Testables"
          else
            echo "✗ PyramidTests NOT in scheme — aborting commit"
            exit 1
          fi
          if grep -q 'PyramidTests.*\.xctest' Pyramid.xcodeproj/project.pbxproj; then
            echo "✓ PyramidTests target exists in pbxproj"
          else
            echo "✗ PyramidTests target missing in pbxproj — aborting commit"
            exit 1
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-debug
          path: |
            Pyramid.xcodeproj/project.pbxproj
            Pyramid.xcodeproj/xcshareddata/xcschemes/Pyramid.xcscheme
          if-no-files-found: ignore

      - name: Commit pbxproj changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Pyramid.xcodeproj/project.pbxproj Pyramid.xcodeproj/xcshareddata/xcschemes/Pyramid.xcscheme
          if git diff --cached --quiet; then
            echo "No changes to commit (target already registered)"
          else
            git commit -m "chore(tests): bootstrap PyramidTests target into pbxproj via xcodeproj gem"
            git push
          fi
