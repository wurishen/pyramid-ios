name: Sync docs to Android

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          path: ios

      - name: Check token availability
        id: check-token
        env:
          ANDROID_SYNC_TOKEN: ${{ secrets.ANDROID_SYNC_TOKEN }}
        run: |
          if [ -z "$ANDROID_SYNC_TOKEN" ]; then
            echo "::warning::ANDROID_SYNC_TOKEN not set — skipping sync."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Android repo
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: wurishen/pyramid-android
          token: ${{ secrets.ANDROID_SYNC_TOKEN }}
          path: android

      - name: Sync docs/
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          mkdir -p android/docs
          cp -r ios/docs/* android/docs/

      - name: Commit and push
        if: steps.check-token.outputs.has_token == 'true'
        working-directory: android
        env:
          ANDROID_SYNC_TOKEN: ${{ secrets.ANDROID_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: sync SPEC from pyramid-ios"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Open sync issue (best effort)
        if: steps.check-token.outputs.has_token == 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.ANDROID_SYNC_TOKEN }}
        run: |
          gh issue create \
            --title "[同步] docs 已从 pyramid-ios 更新" \
            --body "自动同步的文档已推送到 main，请检查是否需要适配到 Android 端。" \
            || echo "::warning::Failed to create issue — skipping."
