name: iOS build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 三个并行 job：
#   lint      - SwiftLint + SPM tests（最快，fail fast）
#   build     - xcodebuild simulator build + iOS tests
#   release   - archive + IPA + GitHub Release（独立，慢但不阻塞 build）
# 总时长从 ~9 min 串行降到 ~4-5 min wall-clock。

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          XCODE_PATH="/Applications/Xcode_16.2.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 16.2 not found at $XCODE_PATH"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install SwiftLint
        # 从 SwiftLint 官方 GitHub Release 下载官方 macOS pkg 安装包，
        # 避开 Homebrew `aws/tap` 未被信任导致 `brew install swiftlint` 失败的坑
        # （macos-14 runner 上默认要求所有 tap 显式 trust，未 trust 的 tap 会被忽略）。
        # 锁版本 0.65.0；如需升级，更新 SWIFTLINT_VERSION 与本地 `.swiftlint.yml` 同步即可。
        # ⚠️ SwiftLint release 的 asset 命名容易误导：`.arm64.zip` / `.amd64.zip`
        # 都是 **Windows** 平台（PE/EXE）；`portable_swiftlint.zip` 是 JVM 类文件
        # （magic `cafebabe`）。macOS 唯一正确的现成分发是 `SwiftLint.pkg`，
        # pkg 会把 swiftlint 装到 `/usr/local/bin/`。
        run: |
          set -euo pipefail
          SWIFTLINT_VERSION="0.65.0"
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          curl -fsSL -o swiftlint.pkg \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLint.pkg"
          sudo installer -pkg swiftlint.pkg -target /
          swiftlint --version

      - name: SwiftLint (warnings only, no --strict)
        # 风格规则已在 .swiftlint.yml 里关了一堆 false-positive；
        # 真问题（unused_declaration / unused_import / empty_count）以 warning 出现在 CI log，
        # 不阻塞 PR。
        run: swiftlint lint --quiet

      - name: SillyTavern compat layer tests (Swift Package)
        run: |
          cd swift-tests
          swift test

  build:
    runs-on: macos-14
    needs: lint
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        # 锁定 macOS-14 上预装的 Xcode 16.2（默认 15.4 在加载带 Testable 的
        # scheme 时会崩 -[__NSArrayM setScheme:]: unrecognized selector）。
        run: |
          XCODE_PATH="/Applications/Xcode_16.2.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 16.2 not found at $XCODE_PATH"
            xcodebuild -version
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          # 把 Xcode 版本写到 cache key，避免不同 Xcode 之间的 DerivedData 串味。
          echo "XCODE_VERSION=16.2" >> "$GITHUB_ENV"

      - name: Cache DerivedData + SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            swift-tests/.build
          key: ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Pyramid/**/*.swift', 'swift-tests/**/*.swift', 'Pyramid.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Simulator build
        run: |
          xcodebuild -project Pyramid.xcodeproj -scheme Pyramid \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Simulator tests (only if PyramidTests target exists)
        run: |
          # 直接 grep pbxproj，避免 xcodebuild -list 在 macOS-14 + Xcode 16 上偶发的
          # `-[__NSArrayM setScheme:]: unrecognized selector` 崩溃。
          if grep -q 'PyramidTests \*/ = {' Pyramid.xcodeproj/project.pbxproj; then
            xcodebuild -project Pyramid.xcodeproj -scheme Pyramid \
              -destination 'platform=iOS Simulator,name=iPhone 15' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              test
          else
            echo "PyramidTests target not registered yet — skipping."
            echo "To enable: trigger the 'Bootstrap iOS test target' workflow once."
            exit 0
          fi

  release:
    runs-on: macos-14
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          XCODE_PATH="/Applications/Xcode_16.2.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 16.2 not found at $XCODE_PATH"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "XCODE_VERSION=16.2" >> "$GITHUB_ENV"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Pyramid/**/*.swift', 'Pyramid.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Archive for device (unsigned)
        run: |
          xcodebuild -project Pyramid.xcodeproj -scheme Pyramid \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Pyramid.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Try to export IPA
        id: export-ipa
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingAllowed</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pyramid.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Package unsigned IPA (fallback)
        if: steps.export-ipa.outcome == 'failure'
        run: |
          APP_PATH="$RUNNER_TEMP/Pyramid.xcarchive/Products/Applications/Pyramid.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "Pyramid-unsigned.ipa" Payload

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyramid-xcarchive-unsigned
          path: ${{ runner.temp }}/Pyramid.xcarchive
          if-no-files-found: error

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyramid-ipa
          path: |
            ${{ runner.temp }}/export/Pyramid.ipa
            ${{ runner.temp }}/Pyramid-unsigned.ipa
          if-no-files-found: warn

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          IPA="$RUNNER_TEMP/export/Pyramid.ipa"
          [ -f "$IPA" ] || IPA="$RUNNER_TEMP/Pyramid-unsigned.ipa"
          [ -f "$IPA" ] || { echo "没有可发布的 IPA，跳过发布"; exit 0; }

          TAG="build-${{ github.run_number }}"
          TITLE="Pyramid 未签名构建 #${{ github.run_number }}"
          SHORT_SHA="${{ github.sha }}"
          REF_NAME="${{ github.ref_name }}"

          cat > "$RUNNER_TEMP/release_body.md" <<EOF
          ## Pyramid 未签名构建

          - 标签：\`$TAG\`
          - 提交：\`$SHORT_SHA\`（分支 \`$REF_NAME\`）
          - 类型：pre-release
          - 附件：\`Pyramid-unsigned.ipa\`

          > ⚠️ **未签名（开发用）产物**，无法直接安装到真机。
          > 请下载后用 Xcode 或其他工具重新签名，或下载同名 Actions Artifact 中的 \`.xcarchive\` 在本机补签名。
          > 打包与签名方法见仓库 README「构建与打包（IPA）」。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA#Pyramid-unsigned.ipa" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release_body.md"
          else
            gh release create "$TAG" "$IPA#Pyramid-unsigned.ipa" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release_body.md" \
              --prerelease
          fi
